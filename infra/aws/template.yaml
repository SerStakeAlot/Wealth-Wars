AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wealth Wars - Presence WebSocket API (API Gateway WebSocket + Lambda + DynamoDB TTL)

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 15
    MemorySize: 256

Parameters:
  StageName:
    Type: String
    Default: prod
  TtlSeconds:
    Type: Number
    Default: 60

Resources:
  PresenceApi:
    Type: AWS::Serverless::Api
    Properties:
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.type"
      StageName: !Ref StageName

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  PresenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.main
      Environment:
        Variables:
          TABLE_NAME: !Ref ConnectionsTable
          TTL_SECONDS: !Ref TtlSeconds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PresenceApi}/*
      Events:
        ConnectRoute:
          Type: Api
          Properties:
            ApiId: !Ref PresenceApi
            Route: $connect
        DisconnectRoute:
          Type: Api
          Properties:
            ApiId: !Ref PresenceApi
            Route: $disconnect
        DefaultRoute:
          Type: Api
          Properties:
            ApiId: !Ref PresenceApi
            Route: $default
        HelloRoute:
          Type: Api
          Properties:
            ApiId: !Ref PresenceApi
            Route: hello
        HeartbeatRoute:
          Type: Api
          Properties:
            ApiId: !Ref PresenceApi
            Route: heartbeat
        SetUsernameRoute:
          Type: Api
          Properties:
            ApiId: !Ref PresenceApi
            Route: set:username

Outputs:
  WebSocketUrl:
    Description: WebSocket URL for the Presence API
    Value: !Sub wss://${PresenceApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  ConnectionsTableName:
    Value: !Ref ConnectionsTable
